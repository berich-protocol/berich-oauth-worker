name: Cross-Platform Security & E2E Proof (macOS + Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  prove-worker-safety-and-e2e:
    name: Verify on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Open-Source Worker Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 6-Stage AST Security Audit & E2E OpenAI Gateway Proof
        run: python prove_it_works.py
